<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Slurm Account Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">

    <!-- Custom CSS -->
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #7393B3; /* HPC-styled navy  #1a2238*/
        }

        .login-container {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background-color: #ffffff;  /* clean white card */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
        }

        .login-box h4 {
            color: #005792; /* blue header */
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .login-box input.form-control {
            margin-bottom: 20px;
        }

        .login-box button {
            font-weight: bold;
            background-color: #005792;
            border: none;
        }

        .login-box button:hover {
            background-color: #00416a;
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
            width: 80px;
            height: auto;
        }

        .alert {
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        .form-text {
            color: #6c757d;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <img th:src="@{/images/slurm-logo.png}" alt="Slurm Logo" class="logo">
        <h4>Slurm Account Manager</h4>

        <!-- Success Message -->
        <div class="alert alert-success" role="alert" th:if="${success}" th:text="${success}"></div>

        <!-- Error Message -->
        <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/layout}" method="post">
            <label for="username" class="sr-only">Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Username" required autofocus>

            <label for="password" class="sr-only">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>

            <input name="_csrf" type="hidden" th:value="${_csrf.token}" />

            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
        </form>

        <p class="form-text text-center mt-3">© CSE-IITH | Slurm HPC Portal</p>
    </div>
</div>
</body>
</html>
