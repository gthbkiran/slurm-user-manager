<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slurm User Management</title>

    <!-- Bootstrap + FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

    <style>
        :root {
          --hpc-blue: #7393B3;
          --hpc-accent: #00bcd4;
          --hpc-dark: #1f1f1f;
          --bg-light: #f5f7fa;
        }

        html, body {
          height: 100%;
          margin: 0;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
        }

        header {
          background-color: var(--hpc-blue);
          color: white;
          height: 70px;
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          z-index: 1000;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .profile-icon {
          background-color: white;
          color: #333;
          border-radius: 50%;
          padding: 5px 7px;
          font-size: 22px;
          cursor: pointer;
        }

        .dropdown-menu {
          left: auto !important;
          right: 0 !important;
        }

        .wrapper {
          display: flex;
          flex: 1;
          padding-top: 70px;
          min-height: calc(100vh - 70px - 50px);
        }

        .sidebar {
          width: 250px;
          background: linear-gradient(to bottom, #1f1f1f, #2a2a2a);
          padding-top: 30px;
          box-shadow: 2px 0 8px rgba(0, 0, 0, 0.2);
        }

        .sidebar h5 {
          color: #f2f2f2;
          font-weight: 600;
          text-align: center;
          font-size: 1.1rem;
          margin-bottom: 20px;
        }

        .sidebar .nav-link {
          color: #ccc;
          padding: 12px 20px;
          font-size: 1rem;
          display: flex;
          align-items: center;
          transition: all 0.2s ease-in-out;
          border-radius: 8px;
          margin: 6px 12px;
        }

        .sidebar .nav-link i {
          margin-right: 12px;
          font-size: 1.1rem;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
          background-color: var(--hpc-accent);
          color: #000;
          font-weight: 600;
          transform: translateX(4px);
        }

        .main-content {
          flex-grow: 1;
          background-color: var(--bg-light);
          padding: 30px;
          overflow: auto;
        }

        footer {
          background-color: var(--hpc-blue);
          color: white;
          text-align: center;
          padding: 10px;
          font-size: 0.9rem;
          height: 50px;
        }

        @media (max-width: 768px) {
          .sidebar {
            width: 100%;
            height: auto;
          }

          .wrapper {
            flex-direction: column;
          }

          .main-content {
            margin-left: 0;
          }
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <div class="d-flex align-items-center justify-content-center position-relative" style="height: 100%;">
        <!-- Centered Logo + Title -->
        <div class="d-flex align-items-center">
            <img th:src="@{/images/slurm-logo.png}" alt="Slurm Logo" style="height: 40px; margin-right: 10px;" />
            <span class="text-white fw-semibold fs-4">Slurm User Manager</span>
        </div>

        <!-- Profile Dropdown -->
        <div class="dropdown position-absolute top-50 translate-middle-y end-0 me-4">
            <a class="btn btn-light rounded-circle dropdown-toggle p-1" href="#" role="button" id="userDropdown"
               data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 24px;">
                <i class="fas fa-user-circle"></i>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                <li><a class="dropdown-item" href="/logout">Logout</a></li>
            </ul>
        </div>
    </div>
</header>

<!-- Page Body -->
<div class="wrapper">
    <!-- Sidebar -->
    <div class="sidebar">
        <h5 class="mb-4">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a th:href="@{/create}" class="nav-link"><i class="fas fa-user-plus"></i> Create Account</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/update}" class="nav-link"><i class="fas fa-user-edit"></i> Update Account</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/delete}" class="nav-link"><i class="fas fa-user-times"></i> Delete Account</a>
            </li>
            <li class="nav-item">
                <a th:href="@{/usercount}" class="nav-link"><i class="fas fa-users"></i> Number of Accounts</a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div th:if="${body != null}">
            <div th:replace="${body}"></div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer>
    &copy; 2024 Slurm User Management. All rights reserved.
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
