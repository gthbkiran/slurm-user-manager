<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execution Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script>
        function animateCounter(id, end) {
            let el = document.getElementById(id);
            let current = 0;
            const step = Math.ceil(end / 100);
            const interval = setInterval(() => {
                current += step;
                if (current >= end) {
                    current = end;
                    clearInterval(interval);
                }
                el.innerText = current;
            }, 20);
        }

        window.onload = () => {
            const count = parseInt(document.getElementById("userCountValue").dataset.count);
            animateCounter("userCountValue", count);
        };
    </script>
</head>
<body>

<div th:if="${flag == 1}">
    <div style="color: green;font-weight: bold;">
        <span th:text="${message}"></span>
    </div>
</div>

<div th:if="${flag == 0}">
    <div style="color: red;font-weight: bold;">
        <span th:text="${message}"></span>
    </div>
</div>

<!-- Bootstrap animated card for number of users -->
<div class="card shadow-lg mt-4 mx-auto" style="max-width: 400px;">
    <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0">👥 Total Regular Users</h4>
    </div>
    <div class="card-body text-center bg-light">
        <h1 id="userCountValue" class="display-3 text-success fw-bold" th:data-count="${usernames.size()}">0</h1>
        <p class="text-muted">users found on SLURM system</p>
    </div>
</div>

<h2 class="mt-5">Usernames:</h2>
<ul>
    <li th:each="username : ${usernames}" th:text="${username}"></li>
</ul>

<p th:if="${errorLogs != null}" th:text="${errorLogs}">errorLogs:</p>
<a href="/">Go back</a>
</body>
</html>
