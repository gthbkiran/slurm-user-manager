<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slurm User Management</title>

    <!-- Bootstrap + FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        :root {
          --hpc-blue: #003366;
          --hpc-accent: #00bcd4;
          --hpc-dark: #1f1f1f;
          --bg-light: #f5f7fa;
        }

        body {
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          background-color: var(--bg-light);
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          margin: 0;
        }

        header {
          background-color: var(--hpc-blue);
          color: white;
          padding: 15px 0;
          text-align: center;
          font-size: 1.5rem;
          font-weight: 600;
        }

        .sidebar {
          position: fixed;
          top: 60px;
          left: 0;
          width: 250px;
          height: calc(100vh - 60px);
          background-color: var(--hpc-dark);
          padding-top: 20px;
          overflow-y: auto;
          z-index: 998;
        }

        .sidebar h5 {
          color: #ccc;
          font-weight: 500;
        }

        .sidebar .nav-link {
          color: #ddd;
          padding: 12px 20px;
          font-size: 0.95rem;
          display: flex;
          align-items: center;
          transition: background-color 0.2s ease-in-out;
        }

        .sidebar .nav-link:hover {
          background-color: var(--hpc-accent);
          color: #000;
        }

        .sidebar .nav-link i {
          margin-right: 10px;
        }

        .sidebar .nav-link.active {
          background-color: var(--hpc-accent);
          color: #000;
          font-weight: 600;
        }

        .main-content {
          margin-left: 250px;
          padding: 30px;
          flex-grow: 1;
          background-color: #f5f7fa;
          min-height: calc(100vh - 120px);
          overflow-y: auto;
        }

        footer {
          background-color: var(--hpc-blue);
          color: white;
          text-align: center;
          padding: 10px;
          font-size: 0.9rem;
        }

        @media (max-width: 768px) {
          .sidebar {
            position: static;
            width: 100%;
            height: auto;
          }

          .main-content {
            margin-left: 0;
            padding: 20px;
          }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="bg-dark-blue py-2">
    <div class="container-fluid d-flex justify-content-center align-items-center px-4 position-relative">

        <!-- Center-aligned logo and title -->
        <div class="d-flex align-items-center">
            <img th:src="@{/images/slurm-logo.png}" alt="Slurm Logo" style="height: 30px;" class="me-2" />
            <span class="h5 mb-0 text-white">Slurm User Manager</span>
        </div>

        <!-- Logout aligned to the right -->
        <div class="position-absolute end-0 px-4">
            <a href="/logout" class="text-white text-decoration-none" style="font-size: 0.9rem;">Logout</a>
        </div>
    </div>
</header>




<!-- Sidebar -->
<div class="sidebar">
    <h5 class="text-center mb-4">Menu</h5>
    <ul class="nav flex-column">
        <li class="nav-item">
            <a th:href="@{/create}" class="nav-link"><i class="fas fa-user-plus"></i> Create Account</a>
        </li>
        <li class="nav-item">
            <a th:href="@{/update}" class="nav-link"><i class="fas fa-user-edit"></i> Update Account</a>
        </li>
        <li class="nav-item">
            <a th:href="@{/delete}" class="nav-link"><i class="fas fa-user-times"></i> Delete Account</a>
        </li>
        <li class="nav-item">
            <a th:href="@{/usercount}" class="nav-link"><i class="fas fa-users"></i> Number of Accounts</a>
        </li>
    </ul>
</div>

<!-- Main Content -->
<div class="main-content">
    <div th:if="${body != null}">
        <div th:replace="${body}"></div>
    </div>
</div>

<!-- Footer -->
<footer>
    &copy; 2024 Slurm User Management. All rights reserved.
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
